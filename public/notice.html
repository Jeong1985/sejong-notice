<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교육 안내장 생성기</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gamja+Flower&family=Jua&family=Nanum+Gothic&family=Nanum+Myeongjo&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="app-bar">
      <div class="app-bar-left">
        <button class="btn-back" id="btnBack">← 목록</button>
        <span class="app-title" id="noticeAppTitle">교육 안내장 생성기</span>
      </div>
    </header>

    <div class="notice-layout">
      <!-- 왼쪽 입력 패널 -->
      <aside class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="btnToggleSidebar">◀</button>
        <div class="sidebar-inner">

          <!-- 📋 문서 설정 -->
          <section class="form-block">
            <h3 class="form-block-title">📋 문서 설정</h3>
            <div class="field-group">
              <label class="field-label">쪽 수</label>
              <div class="page-selector">
                <button class="page-btn active" data-pages="1">1쪽</button>
                <button class="page-btn" data-pages="2">2쪽</button>
                <button class="page-btn" data-pages="3">3쪽</button>
                <button class="page-btn" data-pages="4">4쪽</button>
              </div>
            </div>
            <div class="field-group">
              <label class="field-label">담당</label>
              <input class="field-input" type="text" id="inputResponsible" placeholder="담당자 이름">
            </div>
            <div class="field-group">
              <label class="field-label">전화번호</label>
              <input class="field-input" type="text" id="inputPhone" placeholder="전화번호">
            </div>
            <div class="field-group">
              <label class="field-label">발행일</label>
              <input class="field-input" type="date" id="inputDate">
            </div>
            <div class="field-group">
              <label class="field-label">테두리</label>
              <label class="toggle-wrap">
                <input type="checkbox" id="chkBorder">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-text">실선 테두리</span>
              </label>
            </div>
            <div class="field-group">
              <label class="field-label">제목</label>
              <label class="toggle-wrap">
                <input type="checkbox" id="chkShowTitle" checked>
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-text">제목 표시</span>
              </label>
            </div>
            <div class="field-group">
              <label class="field-label">절취선 (✂)</label>
              <label class="toggle-wrap">
                <input type="checkbox" id="chkCutLine">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-text">회신서 추가</span>
              </label>
            </div>
          </section>

          <!-- 🎨 서식 -->
          <section class="form-block pf-section">
            <h3 class="form-block-title">🎨 서식</h3>
            <p class="pf-hint-text">미리보기에서 텍스트를 선택한 뒤 적용하세요</p>
            <div class="pf-bar" id="pfBar">

              <!-- 글꼴 + 크기 -->
              <div class="pf-group">
                <span class="pf-group-label">글꼴</span>
                <div class="pf-row">
                  <select class="pf-font" id="pfFont">
                    <option value="">기본체</option>
                    <option value="Noto Sans KR">노토산스</option>
                    <option value="Nanum Gothic">나눔고딕</option>
                    <option value="Nanum Myeongjo">나눔명조</option>
                    <option value="Black Han Sans">블랙한산스</option>
                    <option value="Do Hyeon">도현</option>
                    <option value="Jua">주아</option>
                    <option value="Gamja Flower">감자꽃</option>
                  </select>
                  <input class="pf-size" type="number" id="pfSize" min="6" max="72" placeholder="12">
                  <span class="pf-unit">pt</span>
                </div>
              </div>

              <!-- 스타일 -->
              <div class="pf-group">
                <span class="pf-group-label">스타일</span>
                <div class="pf-row">
                  <button class="pf-btn pf-style-btn" id="pfBold" title="굵게"><b>B</b></button>
                  <button class="pf-btn pf-style-btn" id="pfItalic" title="기울임"><i>I</i></button>
                  <button class="pf-btn pf-style-btn" id="pfUnderline" title="밑줄"><u>U</u></button>
                  <div class="pf-sep"></div>
                  <button class="pf-btn" data-cmd="justifyLeft"   title="왼쪽 정렬">≡</button>
                  <button class="pf-btn" data-cmd="justifyCenter" title="가운데 정렬">≡</button>
                  <button class="pf-btn" data-cmd="justifyRight"  title="오른쪽 정렬">≡</button>
                  <div class="pf-sep"></div>
                  <label class="pf-color-wrap" title="글자색">
                    <span class="pf-color-icon">A</span>
                    <input type="color" id="pfColor" value="#000000">
                  </label>
                  <button class="pf-btn pf-eraser-btn" id="pfClearFmt" title="서식 지우기">↺</button>
                </div>
              </div>

              <!-- 자간 / 줄간 -->
              <div class="pf-group">
                <span class="pf-group-label">간격 <span class="pf-group-hint">(자간: 선택 영역 / 줄간: 전체 적용)</span></span>
                <div class="pf-slider-row">
                  <span class="pf-slider-label">자간</span>
                  <input type="range" class="pf-range" id="pfLetterSpacing" min="-5" max="20" value="0" step="1">
                  <span class="pf-range-val" id="pfLSVal">0px</span>
                </div>
                <div class="pf-slider-row">
                  <span class="pf-slider-label">줄간</span>
                  <input type="range" class="pf-range" id="pfLineHeight" min="120" max="250" value="190" step="5">
                  <span class="pf-range-val" id="pfLHVal">1.9</span>
                </div>
              </div>

            </div>
          </section>

          <!-- ✂ 회신 내용 -->
          <section class="form-block" id="replyBlock" style="display:none">
            <h3 class="form-block-title">✂ 회신 내용</h3>
            <div class="field-group">
              <label class="field-label">AI 요청사항 <span class="label-hint">(선택)</span></label>
              <textarea class="field-textarea" id="inputReplyRequest" rows="3"
                placeholder="예: 참가 여부 확인란 추가&#10;동의/비동의 선택 형식으로&#10;서명란 2개 (학생·보호자)"></textarea>
            </div>
            <button class="btn-primary w-full" id="btnAiReply">🤖 AI 회신서 생성</button>
            <p class="hint-text" style="margin-top:6px">💡 생성 후 미리보기에서 직접 선택·서식 편집 가능</p>
          </section>

          <!-- 🤖 AI 생성 -->
          <section class="form-block">
            <h3 class="form-block-title">🤖 AI 생성</h3>
            <div class="field-group">
              <label class="field-label">제목</label>
              <div class="input-row">
                <input class="field-input" type="text" id="inputTitle" placeholder="안내장 제목">
                <button class="btn-ai-sm" id="btnAiTitle" title="AI 제목 생성">🤖</button>
              </div>
            </div>
            <div class="field-group">
              <label class="field-label">내용 주제 / 요청사항</label>
              <textarea class="field-textarea" id="inputTopic" rows="4"
                placeholder="예시&#10;· 5월 운동회 안내 (날짜: 5/30, 장소: 운동장)&#10;· 방학 중 생활 지도&#10;· 현장학습 동의서"></textarea>
            </div>
            <button class="btn-primary w-full" id="btnGenerate">🤖 AI로 내용 생성</button>
          </section>

          <!-- 💬 AI 피드백 -->
          <section class="form-block">
            <h3 class="form-block-title">💬 AI 피드백</h3>
            <div class="field-group">
              <textarea class="field-textarea" id="inputFeedback" rows="3"
                placeholder="예: 좀 더 간결하게&#10;날짜를 6월 2일로 바꿔줘"></textarea>
            </div>
            <button class="btn-secondary w-full" id="btnFeedback">💬 피드백 반영</button>
          </section>

          <!-- 🖼️ 이미지 삽입 -->
          <section class="form-block">
            <h3 class="form-block-title">🖼️ 이미지 삽입</h3>
            <div class="upload-zone" id="uploadZone">
              <input type="file" id="inputImages" accept="image/*" multiple hidden>
              <span class="upload-hint">📎 클릭하거나 드래그하여 이미지 업로드</span>
            </div>
            <div id="imagePreviewList" class="image-preview-list"></div>
          </section>

        </div>
      </aside>

      <!-- 오른쪽 미리보기 (직접 수정 가능) -->
      <main class="preview-area">
        <div class="preview-toolbar">
          <span class="preview-label">✏️ 미리보기 — 클릭하여 직접 수정</span>
          <div class="toolbar-actions">
            <button class="btn-export-pdf" id="btnExportPdf">📥 PDF 저장</button>
          </div>
        </div>
        <div class="preview-scroll" id="previewScroll">
          <div id="documentContainer"></div>
        </div>
      </main>
    </div>
  </div>

  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingMsg">처리 중...</p>
    </div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script type="module" src="js/notice.js?v=11"></script>
</body>
</html>
